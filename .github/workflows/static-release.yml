name: Static release CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: static-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:qa-contract
      - run: npm run test:monetization
      - run: npm run test:portal
      - run: npm run test:ads
      - run: npm run test:orbit
      - run: npm run test:orbit-ads
      - run: npm run test:reactor
      - run: npm run test:reactor-ads
      - run: npm run build
      - run: npm run verify:ads-production
      - run: npm run verify:static-release
      - run: npm run cf:check
        env:
          WRANGLER_SEND_METRICS: false
      - uses: actions/upload-artifact@v4
        with:
          name: static-release
          path: dist
